# ── App ───────────────────────────────────────────────
spring.application.name=StockMarketAnalyzer

# ── Database ──────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/stockmarket?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ── JPA ───────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Scheduling ────────────────────────────────────────
spring.task.scheduling.pool.size=4

# ── Logging ───────────────────────────────────────────
logging.level.root=WARN
logging.level.com.stockmarketanalyzer=INFO
logging.level.org.hibernate.SQL=WARN

# ── Swagger ───────────────────────────────────────────
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ── Jackson ───────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ── Compression ───────────────────────────────────────
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024
